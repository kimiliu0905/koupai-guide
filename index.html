<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>扣排打卡教程中心</title>
    <meta
      name="description"
      content="扣排与打卡功能使用教程，支持手机和电脑阅读。"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="site-header" aria-label="站点信息">
        <a class="brand-mark" href="./index.html" aria-label="扣排打卡教程中心首页">
          <span class="brand-mark__dot"></span>
          扣排指南
        </a>
        <span class="status-pill">公开访问测试中</span>
      </header>

      <section class="hero">
        <div class="hero__eyebrow">Step 1 · 公网分享验证</div>
        <h1>扣排打卡教程中心</h1>
        <p>
          这里将用于整理扣排、麦序、任务排、置顶、报备、打卡统计等功能的使用教程。
          当前页面用于先验证公网链接是否可以在手机和电脑正常访问。
        </p>
        <div class="hero__meta" aria-label="教程特点">
          <span>手机可读</span>
          <span>无需登录</span>
          <span>持续更新</span>
        </div>
      </section>

      <section class="check-card" aria-labelledby="check-title">
        <h2 id="check-title">本阶段校验目标</h2>
        <ul class="check-list">
          <li>电脑浏览器可以打开这个教程站。</li>
          <li>手机浏览器可以打开同一个链接。</li>
          <li>把链接发给别人后，对方无需登录即可阅读。</li>
        </ul>
      </section>

      <section class="module-grid" aria-label="后续教程模块">
        <article class="module-card">
          <span>01</span>
          <h3>扣排教程</h3>
          <p>后续放置开始运行、设置麦序、任务排、买8、置顶、补排、禁排等说明。</p>
        </article>
        <article class="module-card">
          <span>02</span>
          <h3>打卡教程</h3>
          <p>后续放置打卡设置、有效麦序判定、打卡统计、异常处理等说明。</p>
        </article>
      </section>
    </main>
  </body>
</html>
